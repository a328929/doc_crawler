services:
  doc_crawler:
    build: .
    container_name: doc_crawler_app
    restart: always
    ports:
      - "5000:5000"
    volumes:
      # 挂载代码目录：git pull 后只需重启容器即可加载最新代码（无需重建镜像）
      - ./:/app
      - ./temp_docs:/app/temp_docs
    environment:
      - TZ=Asia/Shanghai
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
